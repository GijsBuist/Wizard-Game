<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wizard – the trick-taking card game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <script>
    // ES modules cannot load from a double-clicked file, they need to be served over http(s).
    if (location.protocol === 'file:') {
      document.getElementById('app').innerHTML =
        '<div class="menu"><h1 class="title">🧙 Wizard</h1><div class="box"><p>This game must be opened through a web server, not by double-clicking the file.</p>' +
        '<p>Publish it with GitHub Pages, or run <code>python3 -m http.server</code> in this folder and open <code>http://localhost:8000</code>.</p></div></div>';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
